
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Arcade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at center, #111827, #000000);
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }
    .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }
    @keyframes pulse-fade {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.95); }
    }
    .expiring-mark {
      animation: pulse-fade 1.5s infinite ease-in-out;
    }

    /* Reversi 3D Styles */
    .reversi-cell {
      perspective: 1000px;
    }
    .reversi-disc-container {
      width: 85%;
      height: 85%;
      position: relative;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .reversi-disc-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 -4px 6px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.5);
    }
    .reversi-disc-black {
      /* Made brighter: shifted from deep dark purple to a more vibrant neon purple/magenta */
      background: linear-gradient(145deg, #d946ef, #7e22ce);
      border: 2px solid #f5d0fe;
      box-shadow: inset 0 -4px 6px rgba(0,0,0,0.3), 0 0 15px rgba(168, 85, 247, 0.4);
    }
    .reversi-disc-white {
      background: linear-gradient(145deg, #ffffff, #a5f3fc);
      border: 2px solid #22d3ee;
      transform: rotateY(180deg);
      box-shadow: inset 0 -4px 6px rgba(0,0,0,0.1), 0 0 15px rgba(34, 211, 238, 0.4);
    }
    .is-flipping-white {
      transform: rotateY(180deg);
    }
    .is-flipping-black {
      transform: rotateY(0deg);
    }
    
    /* Glossy effect */
    .reversi-disc-face::after {
      content: '';
      position: absolute;
      top: 10%;
      left: 15%;
      width: 30%;
      height: 20%;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      filter: blur(2px);
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.5s ease-out forwards;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
